
[platformio]
name = "Jarvis Power"
description = "IHU for a custom UPS [Universal Power Supply]"
; default_envs = esp32_OTA

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
lib_deps =
    ModbusMaster
    ArduinoJson
    https://github.com/mathieucarbou/AsyncTCP
    https://github.com/mathieucarbou/ESPAsyncWebServer
    https://github.com/ayushsharma82/WebSerial

[env:esp32_OTA]
platform = espressif32@6.5.0      ; Arduino core 2.0.17
board = esp32dev
framework = arduino
upload_protocol = espota
; Use the mDNS name so a changed DHCP lease does not break OTA.
; Must match `hostname` in src/wifi_creds.h. Current lease: 192.168.1.65
upload_port = powmr.local
; upload_port = 192.168.1.65
; targets = upload

[env:esp32_USB]
platform = espressif32@6.5.0      ; Arduino core 2.0.17
board = esp32dev
framework = arduino
; upload_protocol = serial
upload_port = /dev/ttyUSB2
monitor_speed = 9600
; build_flags = -DCORE_DEBUG_LEVEL=5 ; 5 max / 0 min
